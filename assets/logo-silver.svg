<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
<title id="title">OnTheMapX silver wordmark</title>
<desc id="desc">An oval silver wordmark with a diamond at the start and an irregular star at the destination.</desc>
<defs>
  <linearGradient id="silver" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#63686c"/><stop offset=".18" stop-color="#f7f7f3"/>
    <stop offset=".34" stop-color="#9ca2a5"/><stop offset=".52" stop-color="#ffffff"/>
    <stop offset=".72" stop-color="#767c80"/><stop offset="1" stop-color="#e1e4e6"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".22"/>
  </filter>
</defs>
<ellipse cx="540" cy="184" rx="500" ry="145" fill="none" stroke="url(#silver)" stroke-width="2.5" opacity=".72"/>
<g fill="none" stroke="url(#silver)" stroke-width="10" stroke-linejoin="round" filter="url(#shadow)">
  <path d="M78 90 L102 146 L158 170 L102 194 L78 250 L54 194 L0 170 L54 146 Z" transform="translate(36 10) scale(.68)"/>
  <path d="M78 118 L92 156 L128 170 L92 184 L78 222 L64 184 L28 170 L64 156 Z" transform="translate(36 10) scale(.68)" stroke-width="5"/>
</g>
<text x="150" y="230" font-family="Bodoni 72, Didot, Iowan Old Style, Baskerville, Times New Roman, serif" font-size="142" font-weight="400" letter-spacing="-7" fill="url(#silver)" stroke="#596064" stroke-width="1.8" paint-order="stroke" filter="url(#shadow)">OnTheMap</text>
<g transform="translate(890 54)" fill="none" stroke="url(#silver)" stroke-width="9" stroke-linejoin="miter" filter="url(#shadow)">
  <path d="M94 0 L111 54 L159 23 L141 79 L198 83 L147 111 L192 147 L133 139 L143 198 L105 151 L78 202 L72 143 L18 166 L57 119 L0 96 L59 82 L34 28 L82 59 Z"/>
  <path d="M96 41 L110 74 L144 62 L128 93 L162 108 L126 114 L134 149 L104 128 L84 158 L80 123 L45 132 L69 106 L42 83 L78 84 Z" stroke-width="5"/>
  <circle cx="101" cy="103" r="17" stroke-width="7"/>
</g>
</svg>